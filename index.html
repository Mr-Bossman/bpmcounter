<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPM Counter</title>
  <link href="https://fonts.cdnfonts.com/css/faith-hope" rel="stylesheet">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #0a0e1a;
      user-select: none;
      overflow: hidden;
    }
    #tap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 1;
    }
    #tap:active { background: rgba(255,255,255,0.03); }
    #controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 1em;
      padding: 0.5em 1em;
      pointer-events: none;
    }
    #controls > * { pointer-events: auto; }
    #bpm {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-family: 'Faith Hope', sans-serif;
      font-size: 6rem;
      font-weight: bold;
      color: #000;
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      pointer-events: none;
    }
    #info {
      position: fixed;
      top: 0.5em;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(255,255,255,0.8);
      font-size: 1.8rem;
      pointer-events: none;
    }
    #reset, #auto {
      font-size: 1.1rem;
      padding: 0.5em 1em;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      text-decoration: none;
    }
    #reset:active, #auto:active { background: rgba(255,255,255,0.25); }
    #auto.active { background: rgba(255,68,68,0.2); border-color: rgba(255,68,68,0.5); color: #f66; }
    #scope {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      background: #0a0e1a;
    }
    #scope-style {
      font-size: 1.1rem;
      padding: 0.4em 0.6em;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: #fff;
      color: #000;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <canvas id="scope"></canvas>
  <button id="tap"></button>
  <div id="bpm">TAP</div>
  <div id="info">Tap to the beat</div>
  <div id="controls">
    <button id="reset">Reset</button>
    <button id="auto" class="active">Stop auto BPM</button>
    <select id="scope-style">
      <option value="3-band">3-Band</option>
      <option value="rgb">RGB</option>
      <option value="blue">Blue</option>
    </select>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/detect.js"></script>
  <script src="js/oscilloscope.js"></script>
  <script src="js/bpm.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
